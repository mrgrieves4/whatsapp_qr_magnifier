name: QRMagnifier
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "15.6"
configs:
  Debug: debug
  Release: release
targets:
  QRMagnifier:
    type: application
    platform: macOS
    sources:
      - src
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.qrmagnifier
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        MACOSX_DEPLOYMENT_TARGET: "15.6"
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: QR Magnifier
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright (c) 2026"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: QR Magnifier
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
  QRMagnifierTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: QRMagnifier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.qrmagnifier.tests
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QRMagnifier:
    build:
      targets:
        QRMagnifier: all
    test:
      targets:
        - QRMagnifierTests
